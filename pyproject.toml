[project]
name = "game-record-tool"
version = "2.0.50"
description = "Archive / catalog / notification system for Japanese game-music analog records. No embedded AI; deterministic matching plus Telegram human review. Free to operate."
requires-python = ">=3.12"
# Pinned exactly to match requirements.txt (the file setup.bat installs
# from) so both install routes resolve to identical versions.
dependencies = [
  "httpx==0.28.1",
  "feedparser==6.0.14",
  "feedparser-sgmllib==2.1.0",
  "beautifulsoup4==4.15.0",
  "soupsieve==4.0.1",
  "APScheduler==3.11.3",
  "python-telegram-bot==22.8",
  "tzdata==2025.2",
  "playwright==1.65.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]





